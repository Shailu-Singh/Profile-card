<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attractive Profile Page</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #6ca0e3, #b96383);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 400px;
      text-align: center;
      padding: 40px 30px;
      transition: transform 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(#fe7979, #fad0c4, #fbc2eb, #a6c1ee);
      animation: rotate 8s linear infinite;
      z-index: -1;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .profile-card:hover {
      transform: scale(1.05);
    }

    .profile-card img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #fff;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(255, 154, 158, 0.6);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .profile-card h1 {
      font-size: 26px;
      margin: 10px 0;
      color: #333;
    }

    .profile-card h3 {
      font-size: 16px;
      font-weight: 400;
      color: #666;
      margin-bottom: 20px;
    }

    .profile-card p {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: linear-gradient(135deg, #fff23a, #fad0c4);
      color: #fff;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s, transform 0.3s;
    }

    .btn:hover {
      background: linear-gradient(135deg, #fad0c4, #ff9a9e);
      transform: scale(1.1);
    }

    .social-links {
      margin-top: 25px;
    }

    .social-links a {
      margin: 0 10px;
      text-decoration: none;
      color: #976deb;
      font-size: 20px;
      transition: color 0.3s, transform 0.3s;
    }

    .social-links a:hover {
      color: #333;
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <!-- Replace myphoto.jpg with your actual image file -->
    <img src="Shailu2.jpeg" alt="Profile Photo">
    <h1>Shailendra Kumar</h1>
    <h3>Going harder to becoming good developer</h3>
    <p>
      I craft interactive, visually stunning web experiences with a focus on clean design and smooth user journeys. Skilled in communication, Team work.
    </p>
    <a href="#" class="btn">Explore Portfolio</a>
    <div class="social-links">
      <a href="https://www.linkedin.com/feed/">LinkedIn</a>
      <a href="https://github.com/Shailu-Singh/Profile">GitHub</a>
      <a href="https://www.youtube.com/">YouTube</a>
    </div>
  </div>
</body>
</html>
